# Jede Änderung gehört in CHANGELOG.md (unter [Unreleased]). Überspringen: Label "no-changelog".
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: CHANGELOG.md updated?
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error file=CHANGELOG.md::Please describe this change under [Unreleased] in CHANGELOG.md (or add the label no-changelog)."
            exit 1
          fi
